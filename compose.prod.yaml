# Production: pulls the ready image from GHCR, builds nothing.
# Продукция: тегли готовия образ от GHCR, не строи нищо.
#   docker compose -f compose.prod.yaml pull
#   docker compose -f compose.prod.yaml up -d
#   APP_TAG=v0.6.0 docker compose -f compose.prod.yaml up -d   # exact version / rollback
services:
  app:
    image: ghcr.io/ivokavalski/devops-labs-fn361223024:${APP_TAG:-latest}
    ports:
      - "8000:8000"
    environment:
      APP_VERSION: ${APP_TAG:-latest}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
